name: Parallel Multi-Arch Build

on:
  push:
    branches: [ "v1.0" ]

env:
  # Define your base image name here to avoid repetition
  IMAGE_NAME: public.ecr.aws/citizensadvice/hnc-manager

jobs:
  # JOB 1: Build the individual architectures in parallel
  build-architectures:
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PUBLIC_PUSH_ECR_AWS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PUBLIC_PUSH_ECR_AWS_SECRET }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          aws-region: us-east-1 # ECR Public can only be logged into from the us-east-1 region.

      - name: ECR login
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7
        with:
          registry-type: public

      - name: Build and push architecture-specific image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          # We use the commit SHA + architecture as a temporary tag (e.g., 8a9b2c-amd64)
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch }}

  # JOB 2: Combine the images into a single manifest
  create-manifest:
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PUBLIC_PUSH_ECR_AWS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PUBLIC_PUSH_ECR_AWS_SECRET }}

    # This job MUST wait for both matrix builds to finish
    needs: build-architectures
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          aws-region: us-east-1 # ECR Public can only be logged into from the us-east-1 region.

      - name: ECR login
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7
        with:
          registry-type: public

      - name: Create and push multi-arch manifest
        # We use imagetools to pull the arch-specific tags from the registry 
        # and combine them under the 'latest' and commit SHA tags.
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
